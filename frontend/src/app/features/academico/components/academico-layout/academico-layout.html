<div class="academico-shell">
  <nav class="academico-nav">
    <div class="academico-nav__brand">
      <img src="/Logo_ABACO.png" alt="ABACO" class="academico-nav__logo" />
      <span class="academico-nav__title">SGA ABACO</span>
    </div>

    <ul class="academico-nav__links">
      <li>
        <a routerLink="/academico" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          Inicio
        </a>
      </li>
    </ul>

    <div class="academico-nav__section-label">Academico</div>
    <ul class="academico-nav__links">
      <li>
        <a routerLink="/academico/turmas" routerLinkActive="active">
          Minhas Turmas
        </a>
      </li>
      <li>
        <a routerLink="/academico/alunos" routerLinkActive="active">
          Alunos
        </a>
      </li>
      <li>
        <a routerLink="/academico/presencas" routerLinkActive="active">
          Presencas
        </a>
      </li>
      <li>
        <a routerLink="/academico/notas" routerLinkActive="active">
          Notas
        </a>
      </li>
    </ul>

    <div class="academico-nav__section-label">Logistico</div>
    <ul class="academico-nav__links">
      <li>
        <a routerLink="/academico/pedidos/novo" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
          Novo Pedido
        </a>
      </li>
      <li>
        <a routerLink="/academico/pedidos" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
          Meus Pedidos
        </a>
      </li>
    </ul>

    <div class="academico-nav__user">
      <button type="button" class="academico-nav__logout" (click)="logout()">
        Sair
      </button>
    </div>
  </nav>

  <main class="academico-content">
    <router-outlet></router-outlet>
  </main>
</div>
