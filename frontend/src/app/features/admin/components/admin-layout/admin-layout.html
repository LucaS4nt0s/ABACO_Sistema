<div class="admin-shell">
  <nav class="admin-nav">
    <div class="admin-nav__brand">
      <img src="/Logo_ABACO.png" alt="ABACO" class="admin-nav__logo" />
      <span class="admin-nav__title">SGA ABACO</span>
    </div>

    <ul class="admin-nav__links">
      <li>
        <a routerLink="/admin/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          Inicio
        </a>
      </li>
    </ul>

    <div class="admin-nav__section-label">Academico</div>
    <ul class="admin-nav__links">
      <li>
        <a routerLink="/admin/alunos" routerLinkActive="active">
          Alunos
        </a>
      </li>
      <li>
        <a routerLink="/admin/cursos" routerLinkActive="active">
          Cursos
        </a>
      </li>
      <li>
        <a routerLink="/admin/turmas" routerLinkActive="active">
          Turmas
        </a>
      </li>
      <li>
        <a routerLink="/admin/matriculas" routerLinkActive="active">
          Matriculas
        </a>
      </li>
      <li>
        <a routerLink="/admin/presencas" routerLinkActive="active">
          Presencas
        </a>
      </li>
      <li>
        <a routerLink="/admin/notas" routerLinkActive="active">
          Notas
        </a>
      </li>
    </ul>

    <div class="admin-nav__section-label">Logistico</div>
    <ul class="admin-nav__links">
      <li>
        <a routerLink="/admin/logistico" routerLinkActive="active">
          Visão Geral
        </a>
      </li>
      <li>
        <a routerLink="/admin/logistico/estoque" routerLinkActive="active">
          Estoque
        </a>
      </li>
      <li>
        <a routerLink="/admin/logistico/pedidos" routerLinkActive="active">
          Pedidos
        </a>
      </li>
    </ul>

    <div class="admin-nav__section-label" *ngIf="auth.authState().role === 'DIRECTOR'">Administracao</div>
    <ul class="admin-nav__links" *ngIf="auth.authState().role === 'DIRECTOR'">
      <li>
        <a routerLink="/admin/usuarios" routerLinkActive="active">
          Usuarios
        </a>
      </li>
    </ul>

    <div class="admin-nav__user">
      <button
        type="button"
        class="admin-nav__notification"
        routerLink="/admin/logistico/estoque"
        title="Alertas de estoque"
      >
        <span class="bell-icon">&#128276;</span>
        <span class="notification-badge" *ngIf="estoqueService.alertasCount() > 0">
          {{ estoqueService.alertasCount() }}
        </span>
      </button>
      <button type="button" class="admin-nav__logout" (click)="logout()">
        Sair
      </button>
    </div>
  </nav>

  <main class="admin-content">
    <router-outlet></router-outlet>
  </main>
</div>
