<div class="page-center">
  <div class="login-card" role="region" aria-label="Recuperar senha">
    <div class="brand">
      <img src="/Logo_ABACO.png" alt="ABACO" class="logo" />
    </div>
    <h1>Recuperar Senha</h1>
    <p class="description">Digite seu e-mail para receber um link de recuperação.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <ab-email-field [control]="form.controls.email"></ab-email-field>

      <ab-primary-button [disabled]="form.invalid || loading" [label]="loading ? 'Enviando...' : 'Enviar Link'">
        <span *ngIf="loading" class="spinner" aria-hidden="true"></span>
      </ab-primary-button>

      <div class="error" *ngIf="error">{{ error }}</div>
      <div class="success" *ngIf="success">{{ success }}</div>
    </form>

    <div class="auth-links">
      <a routerLink="/login" class="auth-link">Voltar para o login</a>
    </div>
  </div>
</div>
