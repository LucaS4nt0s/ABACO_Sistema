<main class="classes-management">
  <header class="classes-management__topbar">
    <div>
      <h1>Turmas</h1>
      <p>Painel administrativo para cadastro e gestao de turmas.</p>
    </div>
    <button type="button" class="new-class-btn" (click)="openCreate()" [disabled]="saving || loadingList">Nova turma</button>
  </header>

  <p class="local-feedback" *ngIf="localFeedback">{{ localFeedback }}</p>

  <section class="classes-management__layout">
    <app-class-list
      [turmas]="pagedTurmas"
      [loading]="loadingList || saving"
      [currentPage]="currentPage"
      [totalPages]="totalPages"
      [deletingTurmaId]="deletingTurmaId"
      (search)="onSearch($event)"
      (edit)="openEdit($event)"
      (remove)="onDelete($event)"
      (pageChange)="onPageChange($event)"
    ></app-class-list>

    <app-class-form
      *ngIf="panelOpen"
      [mode]="formMode"
      [turma]="selectedTurma"
      [cursos]="cursos"
      [professores]="professores"
      [loading]="saving"
      (save)="onSave($event)"
      (cancel)="closePanel()"
    ></app-class-form>
  </section>
</main>
