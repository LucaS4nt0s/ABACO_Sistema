services:
  database:
    image: postgres:16
    container_name: sga_database
    restart: always
    environment:
      POSTGRES_DB: sga_abacos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database-schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sga_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sga_abacos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sga_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@database:5432/sga_abacos
      JWT_SECRET: development_secret_change_me
    depends_on:
      database:
        condition: service_healthy
    networks:
      - sga_network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; r = urllib.request.urlopen('http://localhost:8000/api/health'); assert r.status == 200; assert b'ok' in r.read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sga_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sga_network

volumes:
  postgres_data:

networks:
  sga_network:
    driver: bridge